<style>
/* ============================================================
   COZALYZE · COMPLETE TROPICAL READING · T1.0 · one document
   Paid dashboard + reveal + six reading sections in ONE document
   (standing rule: no iframe, no page navigation between them).
   Design tokens and structure follow the supplied spec verbatim.
   ============================================================ */
:root {
  --vedic-navy: #000f26;
  --vedic-gold: #d4a178;
  --vedic-gold-muted: rgba(212, 161, 120, 0.65);
  --vedic-ivory: #e5d4c5;
  --vedic-ivory-muted: rgba(229, 212, 197, 0.88);
  --display-font: "Cormorant Garamond", Georgia, serif;
  --body-font: "Avenir Next", "Helvetica Neue", Arial, sans-serif;
  --side-pad: 28px;
  --dash-zoom: 1;            /* opens showing the whole art, then eases to --dash-zoom-in */
  --dash-zoom-in: 1.12;   /* this art already nearly fills a phone; above ~1.08 the bottom nav leaves the screen */
}
@media (max-width: 374px) { :root { --side-pad: 20px; } }

* { box-sizing: border-box; }
html { background: var(--vedic-navy); -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--vedic-navy);
  color: var(--vedic-ivory);
  font-family: var(--body-font);
  -webkit-font-smoothing: antialiased;
}

/* Fixed background layer: iOS ignores background-attachment on body,
   so the image lives on its own fixed layer behind the scrolling content. */
.vedic-bg {
  position: fixed;
  inset: 0;
  z-index: 0;
  background-color: var(--vedic-navy);
  background-image: url("vedic-moon-bg.png");
  background-size: cover;
  background-position: top center;
  background-repeat: no-repeat;
  pointer-events: none;
}

.vedic-reading-page {
  position: relative;
  z-index: 1;
  min-height: 100svh;
  padding:
    calc(env(safe-area-inset-top) + 24px)
    var(--side-pad)
    calc(env(safe-area-inset-bottom) + 24px);
}

.vedic-reading-content {
  width: 100%;
  max-width: 760px;
  margin: 0 auto;
  animation: vedicFadeIn 240ms ease-out;
}
@keyframes vedicFadeIn {
  from { opacity: 0; transform: translateY(5px); }
  to   { opacity: 1; transform: translateY(0); }
}
@media (prefers-reduced-motion: reduce) {
  .vedic-reading-content { animation: none; }
  .stage { transition: none; }
}

/* ---------- header ---------- */
.vedic-back-button {
  position: absolute;
  top: calc(env(safe-area-inset-top) + 10px);
  left: calc(var(--side-pad) - 10px);
  width: 44px;
  height: 44px;
  padding: 0;
  margin: 0;
  border: 0;
  background: transparent;
  color: var(--vedic-gold);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  -webkit-tap-highlight-color: transparent;
}
.vedic-back-button svg { width: 30px; height: 20px; display: block; }
.vedic-back-button:focus-visible { outline: 1px solid var(--vedic-gold-muted); outline-offset: 4px; border-radius: 4px; }

.vedic-header {
  text-align: center;
  padding-top: 6px;
}
/* His logo lockup (emblem + CozAlyze wordmark) as one image, white keyed out.
   Width is set so the wordmark reads at the spec's 28–30px display size. */
.vedic-logo {
  display: block;
  width: 140px;
  height: auto;
  margin: 0 auto;
}
.vedic-eyebrow {
  font-family: var(--body-font);
  font-size: clamp(13px, 3.5vw, 14.5px);
  font-weight: 500;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: var(--vedic-ivory-muted);
  margin: 12px 0 0;
  padding-left: 0.28em; /* optical centre with the trailing tracking */
}
.vedic-counter {
  font-family: var(--display-font);
  font-size: clamp(27px, 7.2vw, 31px);
  font-weight: 500;
  letter-spacing: 0.06em;
  font-variant-numeric: lining-nums;
  color: var(--vedic-gold);
  margin: 40px 0 0;
}

/* ---------- ornamental divider ---------- */
.vedic-divider {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  width: min(100%, 420px);
  margin: 14px auto;
  color: var(--vedic-gold);
}
.vedic-divider::before,
.vedic-divider::after {
  content: "";
  flex: 1 1 auto;
  height: 1px;
  background: var(--vedic-gold-muted);
}
.vedic-divider svg { width: 16px; height: 16px; flex: 0 0 auto; display: block; }

/* ---------- title ---------- */
.vedic-title {
  font-family: var(--display-font);
  font-size: clamp(2.6rem, 11.5vw, 3.4rem);
  font-weight: 500;
  line-height: 0.98;
  color: var(--vedic-gold);
  text-align: center;
  text-wrap: balance;
  margin: 10px 0;
}
.vedic-title--long {
  font-size: clamp(2.35rem, 10vw, 2.9rem);
}

/* ---------- body ---------- */
.vedic-body {
  font-family: var(--body-font);
  font-size: clamp(1.25rem, 5.4vw, 1.4rem);
  line-height: 1.55;
  font-weight: 400;
  color: var(--vedic-ivory);
  margin-top: 24px;
}
.vedic-body p { margin: 0 0 1.35em; }
.vedic-body p:last-child { margin-bottom: 0; }

/* ---------- bottom navigation ---------- */
.vedic-nav { margin-top: 34px; }
.vedic-nav-rule {
  display: flex;
  align-items: center;
  gap: 10px;
  color: var(--vedic-gold);
}
.vedic-nav-rule::before,
.vedic-nav-rule::after {
  content: "";
  flex: 1 1 auto;
  height: 1px;
  background: var(--vedic-gold-muted);
}
.vedic-nav-rule svg { width: 14px; height: 14px; flex: 0 0 auto; display: block; }
.vedic-nav-links {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  padding-top: 6px;
}
.vedic-nav a,
.vedic-nav button {
  font-family: var(--body-font);
  font-size: clamp(16px, 4.3vw, 18px);
  font-weight: 400;
  color: var(--vedic-gold);
  text-decoration: none;
  background: transparent;
  border: 0;
  padding: 0;
  margin: 0;
  min-height: 44px;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  text-align: left;
}
.vedic-nav a:focus-visible,
.vedic-nav button:focus-visible { outline: 1px solid var(--vedic-gold-muted); outline-offset: 4px; border-radius: 4px; }
.vedic-nav .vedic-nav-next { text-align: right; justify-content: flex-end; }
.vedic-nav svg:not(.vedic-nav-rule svg) { width: 24px; height: 15px; flex: 0 0 auto; }

/* ============================================================
   PAID DASHBOARD  (his art = frame 0 of the reveal clip, so the
   dashboard and the video's first frame are pixel-identical)
   ============================================================ */
body[data-view="dashboard"] .vedic-reading-page,
body[data-view="dashboard"] .vedic-bg { display: none; }
body[data-view="reading"] .dash { display: none; }

.dash {
  position: fixed;
  inset: 0;
  z-index: 5;
  background: var(--vedic-navy);
  overflow: hidden;
}
/* one shared stage: contain-fit box with the clip's exact aspect, centred */
.stage {
  position: absolute;
  left: 50%;
  top: 50%;
  aspect-ratio: 972 / 2128;
  width: min(100vw, calc(100svh * 972 / 2128));   /* contain-fit: the whole art */
  /* --dash-zoom 1 = whole art; above 1 the stage scales up around its centre and
     crops evenly. Done with transform so iOS animates it smoothly. */
  transform: translate(-50%, -50%) scale(var(--dash-zoom, 1));
  transition: transform 1400ms cubic-bezier(0.22, 0.61, 0.36, 1);
  will-change: transform;
  container-type: inline-size;
  overflow: hidden;
}
.stage-art,
.stage video {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
  object-position: center;
  display: block;
  background: var(--vedic-navy);
}
.stage video { background: transparent; }   /* the art under it shows until the first frame paints */
.hot {
  position: absolute;
  margin: 0;
  padding: 0;
  border: 0;
  background: transparent;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  color: transparent;
  font-size: 0;
}
.hot:focus-visible { outline: 1px solid var(--vedic-gold-muted); outline-offset: 2px; border-radius: 8px; }
.hot[disabled] { cursor: default; }
/* live ascendant: shown ONLY when the sign is not the sample Leo baked into the art */
.asc-patch, .asc-glyph, .asc-label { position: absolute; display: none; pointer-events: none; }
.stage[data-asc-live="1"] .asc-patch,
.stage[data-asc-live="1"] .asc-glyph,
.stage[data-asc-live="1"] .asc-label { display: block; }
/* geometry measured on the 972-wide art, all in cqw so x and y share one scale:
   baked lion ring centred (215,1378) outer radius ~44 (~48 with its points), baked "Leo" at x 332–383, y 1394–1417 */
.asc-patch-glyph {
  left: 16.82cqw; top: 136.47cqw;
  width: 10.6cqw; height: 10.6cqw;
  border-radius: 50%;
  background: radial-gradient(circle, rgb(5,17,33) 0 80%, rgba(5,17,33,0) 100%);
}
.asc-patch-text {
  left: 33.7cqw; top: 142.6cqw;
  width: 6.8cqw; height: 4.1cqw;
  background: radial-gradient(ellipse at center, rgb(5,17,33) 0 60%, rgba(5,17,33,0) 100%);
}
.asc-glyph {                       /* his ring-<sign>.png, sized so its ring matches the baked one */
  left: 17.08cqw; top: 136.73cqw;
  width: 10.1cqw; height: 10.1cqw;
}
.asc-glyph img { display: block; width: 100%; height: 100%; }
.asc-label {
  left: 34.26cqw; top: 143.0cqw;
  font: 500 3.5cqw/1 var(--display-font);
  color: var(--vedic-ivory);
  white-space: nowrap;
}
.dash-preparing .hot-reading { opacity: 0.45; }

/* ============================================================
   REVEAL OVERLAY  (video plays once, then everything disappears
   and the reading emerges)
   ============================================================ */
.reveal {
  position: fixed;
  inset: 0;
  z-index: 9999;
  background: var(--vedic-navy);
  overflow: hidden;
  display: none;
}
.reveal.is-on { display: block; }
.reveal .asc-patch, .reveal .asc-glyph, .reveal .asc-label { transition: opacity 320ms ease-out; }
.reveal.asc-off .asc-patch, .reveal.asc-off .asc-glyph, .reveal.asc-off .asc-label { opacity: 0; }
.reveal-curtain {
  position: absolute;
  inset: 0;
  background: var(--vedic-navy);
  opacity: 0;
  transition: opacity 480ms ease-in;
  pointer-events: none;
}
.reveal.is-closing .reveal-curtain { opacity: 1; }
.reveal-back {
  position: absolute;
  top: calc(env(safe-area-inset-top) + 10px);
  left: 18px;
  width: 44px;
  height: 44px;
  border: 0;
  padding: 0;
  background: transparent;
  color: var(--vedic-gold);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  -webkit-tap-highlight-color: transparent;
}
.reveal-back svg { width: 30px; height: 20px; display: block; }
.sr-only {
  position: absolute; width: 1px; height: 1px; overflow: hidden;
  clip: rect(0 0 0 0); white-space: nowrap;
}
body.scroll-locked { overflow: hidden; touch-action: none; }

/* ---------- build stamp (project standing rule) ---------- */
.vedic-stamp {
  position: fixed;
  right: 8px;
  bottom: calc(env(safe-area-inset-bottom) + 4px);
  z-index: 2;
  font: 9px/1 var(--body-font);
  letter-spacing: 0.08em;
  color: rgba(212, 161, 120, 0.35);
  pointer-events: none;
}
</style>
</head>

<script>
/* ============================================================
   SECTION DATA (spec, verbatim)
   ============================================================ */
const vedicReadingSections = [
  { id: "at-your-core",            number: 1, title: "At Your Core",              nextLabel: "Love, Desire & Creativity" },
  { id: "love-desire-creativity",  number: 2, title: "Love, Desire & Creativity", nextLabel: "Work, Money & Expression" },
  { id: "work-money-expression",   number: 3, title: "Work, Money & Expression",  nextLabel: "Wisdom, Purpose & Legacy" },
  { id: "wisdom-purpose-legacy",   number: 4, title: "Wisdom, Purpose & Legacy",  nextLabel: "Challenges & Resilience" },
  { id: "challenges-resilience",   number: 5, title: "Challenges & Resilience",   nextLabel: "Your Essential Takeaway" },
  { id: "essential-takeaway",      number: 6, title: "Your Essential Takeaway",   nextLabel: null }
];
const SECTION_TOTAL = String(vedicReadingSections.length).padStart(2, "0");

/* ============================================================
   READING SOURCE
   The engine supplies window.COZ_TROPICAL_READING before this script runs
   (or stores it in localStorage "cozTropicalReading") as
     { "<section id>": ["paragraph", "paragraph", ...], ... }
   Nothing below is shown to the reader except the paragraphs.
   The FIXTURE is synthetic placeholder prose for design verification
   only, written in the tropical (outer-expression) register. It is not a
   real reading and it is not the Vedic fixture reworded.
   ============================================================ */
const COZ_TROPICAL_READING_FIXTURE = {
  "at-your-core": [
    "The first thing people tend to notice about you may not be the thing you consider most true. Several factors in your chart point toward an outward manner that reads as composed and direct, while the emotional layer underneath moves on its own schedule. That gap is not a contradiction so much as a rhythm, and much of your personality may be shaped by how you manage it.",
    "You are likely to engage with the world through action and evidence rather than theory. When something matters, you tend to test it, and you may have little patience for situations that ask you to wait without a reason. This can make you effective and, at times, quicker to move than the people around you are ready for.",
    "Emotionally, the chart suggests a need for privacy that sits alongside a public confidence. You may share opinions easily and feelings slowly, and the people who know both sides of you are probably few. That selectivity can protect you, and it can also leave others reading only the surface.",
    "You may feel most like yourself when your actions and your standards line up, when what you are doing is something you would defend out loud. The conditions that suit you tend to be ones with room to move, clear stakes, and people who say what they mean."
  ],
  "love-desire-creativity": [
    "In attraction you may respond first to candour. The chart points toward a pull to people who are direct about what they want, and a corresponding impatience with games, even when you are the one playing them. Desire here tends to arrive fast and clear, and it can cool just as quickly if it meets pretence.",
    "Your emotional needs may be steadier than your romantic style suggests. Under the quick start there is a wish for reliability, for a partner who stays consistent when the initial charge has settled. Some of the friction in your relationships may come from the distance between those two speeds.",
    "Affection, for you, is likely to be shown rather than described. Doing something for a person, defending them, making room for them in your plans, may come more naturally than talking about feeling. Partners who need the words can experience this as distance when it is meant as devotion.",
    "Creativity tends to run on the same current as desire. You may make your best work when there is heat behind it, a challenge, a deadline, a person to impress or a point to prove. Play and pleasure can be part of your seriousness rather than a break from it."
  ],
  "work-money-expression": [
    "Your working style may lean toward decisiveness and visible results. The chart suggests you are likely to be trusted with things that need to move, and to find slow consensus draining. You tend to communicate in short, clear lines, and people may come to you when they want an answer rather than a discussion.",
    "Ambition here is probably real but selective. You may not want every promotion, only the ones that come with genuine authority over your own work. Titles matter less than latitude. Environments that reward initiative and tolerate a certain bluntness tend to bring out your best.",
    "With money there may be a pattern of confident spending on what you believe in and caution about everything else. Security matters to you more than it might appear, and a stable base may be what lets you take the risks you are drawn to elsewhere.",
    "Public identity and private motivation may not fully match. Others could see drive and competence; you may be more aware of the effort behind it. Over time your expression tends to become more economical, saying less and landing more, and that may be where your professional voice settles."
  ],
  "wisdom-purpose-legacy": [
    "Meaning, in your chart, is likely to be built from experience rather than received. You tend to trust what you have tested, and beliefs that survive contact with real life become durable convictions. This can make you slow to adopt a philosophy and steady once you have.",
    "The developmental direction the chart points toward is one of widening. Familiar patterns favour self-reliance and quick judgement. Growth may lie in letting other people's perspectives change your mind before you have decided, and in valuing what you cannot control alone.",
    "You may influence others more by example than by instruction. People are likely to watch how you handle pressure and take their cue from that. The legacy this suggests is less a body of ideas than a way of standing, a demonstration that directness and care can coexist.",
    "Long-term maturation may show up as a softening of the edges without loss of force. The chart suggests that what you are learning to cultivate is patience with process, so that the results you value can outlast the moment they were won."
  ],
  "challenges-resilience": [
    "The recurring pressure in your chart may be impatience turned inward. Standards that make you effective can make waiting feel like failure, and periods where progress is slow may be harder on you than any setback. The risk is not giving up; it is pushing when the situation calls for holding still.",
    "A second tension sits between independence and connection. You may be inclined to handle difficulty alone and to see asking for help as a cost, which can leave the people closest to you outside the very moments that would let them in.",
    "When strengths run hot they can tip over. Directness can become abruptness, decisiveness can become a refusal to revisit a call, and confidence can read as not listening. Knowing which of these you reach for under stress may be half the work.",
    "Your resilience is likely to be active rather than passive. You tend to recover by doing, by setting the next task and moving toward it, and that instinct is sound as long as it leaves some room for feeling the thing before you fix it. Supportive factors in the chart point toward physical outlets and trusted, plain-spoken company as the most reliable steadiers."
  ],
  "essential-takeaway": [
    "Across the whole chart the same shape keeps appearing: a fast, direct outer self and a slower, more private inner one. Nearly every theme in this reading, in love, in work, in how you handle pressure, may be one expression of the distance between those two speeds.",
    "The central tension is between acting and waiting. Your strengths live on the acting side, and the potential the chart points toward lives in learning when the waiting is the braver move. That is not a change of character; it is the same character with a wider range.",
    "Your natural strengths may include clarity, courage in the moment, loyalty shown through action, and the ability to make things happen. Your likely growth areas may include letting people in before you have solved the problem, and trusting slow processes to finish.",
    "If there is one thing to carry from this, it may be that your directness is not the obstacle to closeness that it sometimes feels like. Paired with a little more patience, it may be exactly what lets people trust you."
  ]
};

function loadReading() {
  if (window.COZ_TROPICAL_READING && typeof window.COZ_TROPICAL_READING === "object") return window.COZ_TROPICAL_READING;
  try {
    const stored = localStorage.getItem("cozTropicalReading");
    if (stored) { const parsed = JSON.parse(stored); if (parsed && typeof parsed === "object") return parsed; }
  } catch (e) {}
  return COZ_TROPICAL_READING_FIXTURE;
}

/* ============================================================
   NAVIGATION TARGETS
   The dashboard lives in THIS document at #/dashboard, so going
   back never leaves the page.
   ============================================================ */
const params = new URLSearchParams(location.search);
const DASHBOARD_HREF = "#/dashboard";

function goDashboard() {
  if (idFromHash() === "dashboard") showFromHash(); else location.hash = DASHBOARD_HREF;
}

function finishReading() {
  try { localStorage.setItem("cozTropicalReadingComplete", new Date().toISOString()); } catch (e) {}
  try { window.dispatchEvent(new CustomEvent("COZ_TROPICAL_READING_COMPLETE")); } catch (e) {}
  goDashboard();
}

/* ============================================================
   RENDER
   ============================================================ */
const STAR_SVG = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 0 13.6 10.4 24 12 13.6 13.6 12 24 10.4 13.6 0 12 10.4 10.4Z"/></svg>';
const ARROW_L = '<svg viewBox="0 0 22 14" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 7H2M7 2 2 7l5 5"/></svg>';
const ARROW_R = '<svg viewBox="0 0 22 14" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 7h19M15 2l5 5-5 5"/></svg>';

function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

function sectionById(id) { return vedicReadingSections.find(s => s.id === id) || vedicReadingSections[0]; }

function renderSection(section) {
  const reading = loadReading();
  const paragraphs = Array.isArray(reading[section.id]) ? reading[section.id] : [];
  const sectionCounter = `${String(section.number).padStart(2, "0")} OF ${SECTION_TOTAL}`;
  const titleClass = section.title.length > 22 ? "vedic-title vedic-title--long" : "vedic-title";
  const next = section.nextLabel ? vedicReadingSections[section.number] : null;

  const nextControl = next
    ? `<a class="vedic-nav-next" href="#/${next.id}" data-next="${next.id}">Next: ${esc(section.nextLabel)} ${ARROW_R}</a>`
    : `<button class="vedic-nav-next" type="button" id="vedicFinish">Finish Reading ${ARROW_R}</button>`;

  const html = `
    <header class="vedic-header">
      <img class="vedic-logo" src="vedic-logo.png" alt="CozAlyze" width="1000" height="1055">
      <p class="vedic-eyebrow">Your Tropical Reading</p>
      <p class="vedic-counter">${sectionCounter}</p>
    </header>
    <div class="vedic-divider" aria-hidden="true">${STAR_SVG}</div>
    <h1 class="${titleClass}">${esc(section.title)}</h1>
    <div class="vedic-divider" aria-hidden="true">${STAR_SVG}</div>
    <section class="vedic-body">
      ${paragraphs.map(p => `<p>${esc(p)}</p>`).join("")}
    </section>
    <nav class="vedic-nav" aria-label="Reading navigation">
      <div class="vedic-nav-rule" aria-hidden="true">${STAR_SVG}</div>
      <div class="vedic-nav-links">
        <a href="#/dashboard" id="vedicNavBack">${ARROW_L} Back to Your Reading</a>
        ${nextControl}
      </div>
    </nav>`;

  const old = document.getElementById("vedicContent");
  const fresh = old.cloneNode(false);      // fresh node so the fade re-runs on every section
  fresh.innerHTML = html;
  old.replaceWith(fresh);

  document.title = `${section.title} · Your Tropical Reading · CozAlyze`;

  const finish = document.getElementById("vedicFinish");
  if (finish) finish.addEventListener("click", finishReading);
}

/* ============================================================
   HISTORY / ROUTING  (#/<section id>)
   ============================================================ */
function idFromHash() {
  const m = location.hash.match(/^#\/?([a-z0-9-]+)/i);
  return m ? m[1] : null;
}

function showDashboard() {
  document.body.dataset.view = "dashboard";
  document.title = "Your Tropical Reading · CozAlyze";
  window.scrollTo({ top: 0, behavior: "instant" });
}

function showFromHash() {
  const id = idFromHash();
  if (!id || id === "dashboard") {
    if (id !== "dashboard") history.replaceState({ id: "dashboard" }, "", "#/dashboard");
    showDashboard();
    return;
  }
  const section = sectionById(id);
  if (id !== section.id) {
    history.replaceState({ id: section.id }, "", `#/${section.id}`);
  }
  document.body.dataset.view = "reading";
  renderSection(section);
  window.scrollTo({ top: 0, behavior: "instant" });
}

document.getElementById("vedicBack").addEventListener("click", goDashboard);

/* ============================================================
   DASHBOARD
   ============================================================ */
const SIGNS = ["Aries","Taurus","Gemini","Cancer","Leo","Virgo","Libra","Scorpio","Sagittarius","Capricorn","Aquarius","Pisces"];
const SAMPLE_SIGN_IN_ART = "Leo";   // baked into tropical-dash.jpg and the clip's first frames
const RING_ICON = sign => `ring-${sign.toLowerCase()}.png`;   // his 12 ring icons, in this repo

function resolveAscendant() {
  const pick = v => { if (!v) return null; v = String(v).trim(); v = v.charAt(0).toUpperCase() + v.slice(1).toLowerCase(); return SIGNS.includes(v) ? v : null; };
  // TROPICAL ascendant only. emergeAscendant holds the SIDEREAL sign (about 24° behind), so it is
  // deliberately not read here; the tropical reveal stores emergeAscendantTropical.
  return pick(params.get("asc")) || pick(window.EMERGE_ASCENDANT_TROPICAL) || pick((() => { try { return localStorage.getItem("emergeAscendantTropical"); } catch (e) { return null; } })()) || SAMPLE_SIGN_IN_ART;
}

function paintAscendant(stage, sign) {
  const live = sign !== SAMPLE_SIGN_IN_ART;
  stage.dataset.ascLive = live ? "1" : "0";
  stage.querySelector(".asc-glyph").innerHTML = live ? `<img src="${RING_ICON(sign)}" alt="">` : "";
  stage.querySelector(".asc-label").textContent = sign;
}

/* Entrance: the whole art is shown first, then it eases in slightly so the type reads larger.
   Once per page load; the reveal's stage shares the variable so the clip matches. */
function dashZoomIn() {
  const target = getComputedStyle(document.documentElement).getPropertyValue("--dash-zoom-in").trim() || "1.12";
  const go = () => document.documentElement.style.setProperty("--dash-zoom", target);
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) { go(); return; }
  const art = document.querySelector("#dashStage .stage-art");
  const start = () => setTimeout(go, 650);
  if (art.complete) start(); else art.addEventListener("load", start, { once: true });
}
dashZoomIn();

const ASC_SIGN = resolveAscendant();
paintAscendant(document.getElementById("dashStage"), ASC_SIGN);
paintAscendant(document.getElementById("revealStage"), ASC_SIGN);
document.querySelector('[data-dash="ascendant"]').setAttribute("aria-label", `Your Ascendant, ${ASC_SIGN}`);

/* Reading readiness. The engine sets window.COZ_TROPICAL_READING_STATUS = "preparing"
   while it works; anything else counts as ready. The reading is never regenerated
   here, this page only reads what the engine stored. */
function readingReady() { return window.COZ_TROPICAL_READING_STATUS !== "preparing"; }
function syncReadyState() {
  const ready = readingReady();
  const b = document.getElementById("hotReading");
  b.disabled = !ready;
  b.setAttribute("aria-label", ready ? "Your Tropical Reading" : "Preparing Your Reading…");
  document.getElementById("dash").classList.toggle("dash-preparing", !ready);
}
syncReadyState();
window.addEventListener("COZ_TROPICAL_READING_STATUS", syncReadyState);

/* Other dashboard doors: not built yet. Each fires an event and follows a
   data-href if one is set later, nothing else. Entitlement check hook for the
   payment system goes here too, once one exists (never a URL parameter). */
document.querySelectorAll(".hot[data-dash]").forEach(btn => {
  btn.addEventListener("click", () => {
    const id = btn.dataset.dash;
    try { window.dispatchEvent(new CustomEvent("COZ_TDASH_" + id.toUpperCase().replace(/-/g, "_"), { detail: { ascendant: ASC_SIGN } })); } catch (e) {}
    if (btn.dataset.href) location.href = btn.dataset.href;
  });
});

/* ============================================================
   REVEAL  (tap → lock → play once → curtain → Page 01)
   ============================================================ */
const revealEl = document.getElementById("reveal");
const revealVideo = document.getElementById("revealVideo");
let revealActive = false, revealDone = false, revealTimers = [];
/* warm the clip while the dashboard is up so the turn can start the moment it is tapped */
try { revealVideo.load(); } catch (e) {}

function lockScroll(on) { document.body.classList.toggle("scroll-locked", on); }

function startReveal() {
  if (revealActive || !readingReady()) return;
  revealActive = true; revealDone = false;
  document.getElementById("hotReading").disabled = true;
  lockScroll(true);
  try { window.dispatchEvent(new CustomEvent("COZ_TROPICAL_REVEAL_START", { detail: { ascendant: ASC_SIGN } })); } catch (e) {}

  const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (reduced) { finishReveal(true); return; }

  revealEl.classList.remove("is-closing", "asc-off");
  revealEl.classList.add("is-on");
  document.getElementById("revealLive").textContent = "Opening your Tropical reading";

  // if the clip cannot even start (no network, blocked), move on rather than trap anyone
  revealTimers.push(setTimeout(() => { if (!revealStarted) finishReveal(false); }, 7000));

  revealStarted = false;
  try { revealVideo.currentTime = 0; } catch (e) {}
  const p = revealVideo.play();
  if (p && p.catch) p.catch(() => finishReveal(false));
}

/* timers that depend on the clip actually running start only once it is playing */
let revealStarted = false;
revealVideo.addEventListener("playing", () => {
  if (revealStarted || !revealActive) return;
  revealStarted = true;
  // the live ascendant overlay stays while the buttons are still on screen, then lets go before the burst
  revealTimers.push(setTimeout(() => revealEl.classList.add("asc-off"), 1450));
  // hard cap a little past the clip's 2.5s so a stalled clip never traps anyone
  revealTimers.push(setTimeout(() => finishReveal(false), 3600));
});

function finishReveal(immediate) {
  if (!revealActive || revealDone) return;   // ignore clip events while the reveal is not running
  revealDone = true;
  revealTimers.forEach(clearTimeout); revealTimers = [];
  const land = () => {
    location.hash = "#/at-your-core";          // its own history entry; renders via hashchange
    revealEl.classList.remove("is-on", "is-closing", "asc-off");
    try { revealVideo.pause(); } catch (e) {}
    lockScroll(false);
    revealActive = false;
    syncReadyState();
  };
  if (immediate) { land(); return; }
  revealEl.classList.add("is-closing");         // everything disappears into navy
  setTimeout(land, 500);
}

function cancelReveal() {
  if (!revealActive || revealDone) return;
  revealDone = true;
  revealTimers.forEach(clearTimeout); revealTimers = [];
  try { revealVideo.pause(); revealVideo.currentTime = 0; } catch (e) {}
  revealEl.classList.remove("is-on", "is-closing", "asc-off");
  lockScroll(false);
  revealActive = false;
  syncReadyState();
}

document.getElementById("hotReading").addEventListener("click", startReveal);
document.getElementById("revealBack").addEventListener("click", cancelReveal);
revealVideo.addEventListener("ended", () => finishReveal(false));
revealVideo.addEventListener("error", () => finishReveal(false));

/* Section links are plain hash links: every section is its own history entry,
   so the phone's back gesture steps through them, and back past Page 01 lands on the dashboard. */
window.addEventListener("hashchange", showFromHash);
showFromHash();
</script>
</body>
</html>
